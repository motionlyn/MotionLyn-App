name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - uses: mymindstorm/setup-emsdk@v14

      - name: Kompilasi mesin C++ ke WebAssembly
        continue-on-error: true   # kalau gagal, aplikasi tetap jalan dengan JS
        run: bash native/build-wasm.sh

      - name: Salin file web ke assets
        run: |
          A=android/app/src/main/assets
          mkdir -p $A engine
          cp index.html $A/
          cp -r css js img am effects engine $A/

      - name: Build APK
        working-directory: android
        run: gradle assembleRelease --no-daemon

      - name: Ganti nama APK
        run: cp android/app/build/outputs/apk/release/app-release.apk MotionLyn-0.5.1-beta.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MotionLyn-APK
          path: MotionLyn-0.5.1-beta.apk

      - name: Publikasikan ke Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.5.1-beta
          name: MotionLyn 0.5.1 beta
          prerelease: true
          files: MotionLyn-0.5.1-beta.apk
