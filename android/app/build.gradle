plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'id.my.motionlyn.app'
    compileSdk 34
        lint {
        abortOnError false
        checkReleaseBuilds false
        }

    defaultConfig {
        applicationId "id.my.motionlyn.app"
        minSdk 29
        targetSdk 34
        versionCode 46
        versionName "0.4.6 beta"
    }

    signingConfigs {
        main {
            storeFile file('motionlyn.jks')
            storePassword 'motionlyn123'
            keyAlias 'motionlyn'
            keyPassword 'motionlyn123'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.main
        }
        debug {
            signingConfig signingConfigs.main
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
