name: Extract ZIP

on:
  push:
    paths: ['upload/*.zip']
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ekstrak zip
        id: ex
        run: |
          shopt -s nullglob
          Z=(upload/*.zip)
          if [ ${#Z[@]} -eq 0 ]; then echo "done=0" >> $GITHUB_OUTPUT; exit 0; fi
          rm -rf /tmp/x && mkdir /tmp/x
          unzip -oq "${Z[0]}" -d /tmp/x
          SRC=/tmp/x
          if [ $(ls -A /tmp/x | wc -l) -eq 1 ] && [ -d "/tmp/x/$(ls -A /tmp/x)" ]; then
            SRC="/tmp/x/$(ls -A /tmp/x)"
          fi
          rm -rf css js img index.html
          cp -r "$SRC"/. .
          rm -f upload/*.zip
          echo "done=1" >> $GITHUB_OUTPUT

      - name: Commit hasil
        if: steps.ex.outputs.done == '1'
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Ekstrak zip" || exit 0
          git push

      - name: Jalankan build APK
        if: steps.ex.outputs.done == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build.yml
